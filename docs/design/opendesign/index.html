    function readLatest(){try{const raw=localStorage.getItem(STORAGE);if(raw){const latest=JSON.parse(raw);if(validDatabase(latest))return latest;}}catch(e){}return null;}
    async function save(replacement=null,source='save'){if(state.busy||state.generating)return;if(replacement===null&&!dirty())return;const text=replacement===null?state.draft:replacement;if(bytes(text)>1048576){toast('文件超过 1 MiB，请精简后再保存。','error');return;}state.busy=true;renderTabs();renderWorkspace();renderFileSelector();if(state.tab==='editor'){const b=$('#save');if(b){b.disabled=true;b.setAttribute('aria-busy','true');b.innerHTML=icon('save',16)+'保存中…';}if($('#editor-input'))$('#editor-input').disabled=true;if($('#generate'))$('#generate').disabled=true;if($('#discard'))$('#discard').disabled=true;}await new Promise(resolve=>setTimeout(resolve,400));const latest=readLatest();if(latest&&latest.workspaces[state.workspace].files[state.file].version!==state.loadedVersion){state.db=latest;state.conflict=true;state.busy=false;renderAll();if(state.tab!=='editor'){state.tab='editor';renderTabs();renderView();}toast('检测到新版本，已阻止覆盖。请重新读取。','error');return;}if(latest)state.db=latest;const r=record();if(r.exists)r.history.unshift({id:'backup-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),time:Date.now(),content:r.content,source,sample:false});r.content=text;r.exists=true;r.version+=1;state.loadedVersion=r.version;state.draft=text;state.proposal=null;state.conflict=false;const stored=persist();state.busy=false;state.diffId=null;renderAll();toast(stored?(source==='rollback'?'已回滚；回滚前的版本已备份':'已保存到此浏览器'):'浏览器存储不可用，本次更改仅保留在当前页面',stored?'ok':'error');}
    function renderProposal(){if(state.generating)return `<section class="proposal" aria-busy="true" aria-label="正在准备示例提案"><h2>正在整理指令</h2><p class="section-subtitle">根据当前作用域准备示例提案…</p><div class="skeleton" role="progressbar" aria-label="正在准备提案"><span></span><span></span><span></span></div></section>`;const p=state.proposal;if(!p)return '';const stale=p.base!==state.draft;return `<section class="proposal" aria-labelledby="proposal-title"><div class="section-heading"><div><h2 id="proposal-title">${p.whole?'文件草稿':'修改提案'}</h2><p class="section-subtitle">${p.whole?'填写 TODO 后再保存':'逐项确认，再合并到编辑器'}</p></div><button class="icon-btn" id="close-proposal" aria-label="放弃草稿">${icon('close',16)}</button></div><div class="notice">${icon('info',16)}<p>示例提案，未调用模型。${file().group==='全局'?'仅整理全局约定，不使用当前项目事实。':'根据示例仓库信息展示提案流程。'}</p></div>${stale?`<div class="notice warning" role="alert">${icon('alert',16)}<p>编辑内容已变化，已阻止应用过期提案。请放弃草稿，保存后重新生成。</p></div>`:''}${p.whole?`<article class="markdown hunk">${markdown(p.whole)}</article>`:p.hunks.length?p.hunks.map((h,i)=>`<div class="hunk"><label class="hunk-heading"><input type="checkbox" data-hunk="${i}" ${h.selected?'checked':''} ${stale?'disabled':''}><span class="hunk-title">${esc(h.title)}</span><span class="hunk-index">0${i+1}</span></label><div class="diff-code">${h.addition.split('\n').filter(Boolean).map(l=>`<div class="diff-line add"><span>+</span><span>${esc(l)}</span></div>`).join('')}</div></div>`).join(''):'<div class="empty"><h3>指令已包含这些约定</h3><p>无需重复添加，你可以继续编辑现有内容。</p></div>'}<details class="proposal-facts"><summary>依据的事实 · ${p.facts.length} 项</summary><ul>${p.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details><div class="button-row"><button class="text-action" id="regenerate" ${dirty()?'disabled':''}>${icon('refresh',16)}重新生成</button><button class="btn btn-primary" id="apply-proposal" ${stale||(!p.whole&&!p.hunks.some(h=>h.selected))?'disabled':''}>${icon('check',16)}${p.whole?'应用草稿':`应用选中 (${p.hunks.filter(h=>h.selected).length})`}</button></div></section>`;}
    function bindProposal(){if(!state.proposal)return;$('#close-proposal').onclick=()=>{state.proposal=null;$('#proposal-area').innerHTML='';$('#generate').focus();};document.querySelectorAll('[data-hunk]').forEach(c=>c.onchange=()=>{state.proposal.hunks[Number(c.dataset.hunk)].selected=c.checked;const b=$('#apply-proposal');b.disabled=state.proposal.base!==state.draft||!state.proposal.hunks.some(h=>h.selected);b.innerHTML=icon('check',16)+`应用选中 (${state.proposal.hunks.filter(h=>h.selected).length})`;});$('#regenerate').onclick=generate;$('#apply-proposal').onclick=()=>{const p=state.proposal;if(!p||p.base!==state.draft)return;state.draft=p.whole||p.base.trimEnd()+p.hunks.filter(h=>h.selected).map(h=>'\n\n'+h.addition).join('')+'\n';state.proposal=null;state.mode='edit';renderView();toast('提案已合并到编辑器，保存后生效于本地示例');$('#save').focus();};}
    async function generate(){if(dirty()||state.generating||state.busy)return;state.generating=true;state.proposal=null;renderTabs();renderWorkspace();renderFileSelector();renderView();await new Promise(resolve=>setTimeout(resolve,800));const global=file().group==='全局';const all=global?[{title:'补充规则优先级',addition:'## 规则适用范围\n- 本文件仅包含跨项目通用规则。\n- 项目专属命令写在项目指令中。',selected:true},{title:'明确协作反馈',addition:'## 完成反馈\n- 说明修改内容与尚未解决的问题。',selected:true}]:[{title:'补充运行环境',addition:'## 运行环境\n- Node.js 版本要求为 22 或更高。\n- 插件运行于 DSH 0.2.1-rc.2。',selected:true},{title:'补充变更验证',addition:'## 变更验证\n- 提交前运行现有测试。\n- 涉及文案时同步检查中英文词条。',selected:true}];state.proposal={base:state.draft,whole:state.draft.trim()?'':global?'# 全局工作约定\n\n## 沟通偏好\n- TODO：填写跨项目的沟通约定。\n\n## 工作边界\n- TODO：填写通用协作边界。\n':`# 项目工作约定\n\n## 项目概览\n- TODO：填写项目职责。\n\n## 验证命令\n- TODO：填写项目实际使用的验证命令。\n`,hunks:all.filter(h=>!state.draft.includes(h.addition)),facts:global?['当前文件作用域：全局','仅读取当前全局文件内容','未使用项目脚本或依赖信息']:state.workspace==='desk'?['package.json → engines.node: >=22','package.json → scripts.test: node --test test/*.test.mjs','README.md → DSH 0.2.1-rc.2']:['当前工作区：个人工作区（示例）','未提供项目依赖与脚本，保留 TODO']};if(!global&&state.workspace!=='desk'&&state.draft.trim()){state.proposal.hunks=[{title:'明确项目边界',addition:'## 项目边界\n- TODO：补充当前项目专属的工作规则。',selected:true}];}state.generating=false;renderTabs();renderWorkspace();renderFileSelector();renderView();$('#proposal-title')?.scrollIntoView({block:'nearest',behavior:'smooth'});}
    function computeChain(){const data=state.db.workspaces[state.workspace].files;const rows=[];const seen=new Map();for(const f of FILES.filter(f=>f.group!=='子目录')){const r=data[f.id];const trimmed=r.content.trim();const row={...f,sourceBytes:bytes(r.content),includedBytes:0,status:'loaded',text:trimmed};if(!r.exists)row.status='absent';else if(bytes(r.content)>1048576)row.status='ignored';else if(seen.has((f.group==='全局'?f.id:'project')+'|'+trimmed))row.status='duplicate';else seen.set((f.group==='全局'?f.id:'project')+'|'+trimmed,true);rows.push(row);}let included=rows.filter(r=>r.status==='loaded');const frame=list=>'<system-reminder>\nThe following instructions apply to this workspace.\n'+list.map(r=>'# '+r.path+'\n'+r.text).join('\n\n')+'\n</system-reminder>';while(bytes(frame(included))>65536&&included.length>1){const omitted=included.shift();omitted.status='omitted';}if(included.length&&bytes(frame(included))>65536){const last=included[0];last.status='truncated';const original=last.text;let low=0,high=original.length;while(low<high){const mid=Math.ceil((low+high)/2);last.text=original.slice(0,mid)+'\n[truncated]';if(bytes(frame(included))<=65536)low=mid;else high=mid-1;}last.text=original.slice(0,low).replace(/[\uD800-\uDBFF]$/,'')+'\n[truncated]';}for(const r of included)r.includedBytes=bytes(r.text);const used=included.length?bytes(frame(included)):0;return{rows,dynamic:FILES.filter(f=>f.group==='子目录'&&data[f.id].exists),used,remaining:65536-used,percent:used/65536*100,tokens:Math.ceil(used/4)};}
    const STATUS={loaded:{label:'已纳入',icon:'check',class:'loaded',reason:''},duplicate:{label:'已去重',icon:'minus',class:'',reason:'内容与同目录更早的候选文件相同，不重复纳入。'},absent:{label:'未创建',icon:'minus',class:'',reason:'文件尚不存在，不参与基线。'},ignored:{label:'已忽略',icon:'alert',class:'problem',reason:'超过 1 MiB 单文件上限，整份忽略。'},omitted:{label:'已省略',icon:'alert',class:'problem',reason:'超出渲染预算，较宽泛的指令优先省略。'},truncated:{label:'已截断',icon:'alert',class:'problem',reason:'预算不足，仅纳入最具体文件的部分内容。'}};
    function renderChain(){const c=computeChain();return `<div class="section-heading"><div><h2>生效链</h2><p class="section-subtitle">从通用规则，到当前项目。</p></div><button class="icon-btn" id="refresh-chain" aria-label="重新计算生效链" title="重新计算">${icon('refresh')}</button></div><div class="budget"><div class="od-row"><span class="budget-title od-fill">上下文预算</span><span class="scope-badge">静态复算</span></div><div class="od-row" style="align-items:baseline"><div class="budget-number od-fill">${(c.used/1024).toFixed(1)}<small>/ 64 KiB</small></div><span class="budget-percent">${c.percent.toFixed(1)}%</span></div><progress class="meter" value="${c.used}" max="65536" aria-label="上下文预算使用率"></progress><div class="budget-meta"><span>剩余 ${fmtBytes(c.remaining)}</span><span>约 ${c.tokens.toLocaleString('zh-CN')} tokens</span></div></div><div class="od-row"><h3 class="section-label od-fill">基线加载顺序</h3><span class="proposal-count">宽泛 → 具体</span></div><ol class="chain-list">${c.rows.map((r,i)=>{const s=STATUS[r.status];return `<li class="chain-row"><span class="chain-number">${String(i+1).padStart(2,'0')}</span><div class="od-field od-fill"><span class="chain-name">${esc(r.display)}</span><span class="chain-path">${esc(r.path)}</span>${r.status==='loaded'||r.status==='truncated'?`<span class="chain-path">纳入 ${fmtBytes(r.includedBytes)} / 原文 ${fmtBytes(r.sourceBytes)}</span>`:''}${s.reason?`<p class="chain-reason">${s.reason}</p>`:''}</div><span class="chain-status ${s.class}">${icon(s.icon,12)}${s.label}</span></li>`;}).join('')}</ol><div class="od-row"><h3 class="section-label od-fill">子目录指令</h3><span class="scope-badge">按需加载</span></div>${c.dynamic.length?`<div class="chain-list">${c.dynamic.map(f=>`<div class="chain-row"><span class="chain-number">${icon('branch',14)}</span><span class="od-field od-fill"><span class="chain-name">${esc(f.display)}</span><span class="chain-reason">工具触碰目录后注入，不计入基线预算。</span></span><button class="text-action" data-chain-file="${f.id}">编辑</button></div>`).join('')}</div>`:'<p class="section-subtitle" style="margin-block:16px 24px">没有已创建的子目录指令。</p>'}<details class="rule-details"><summary>复算依据与限制</summary><ul><li>默认渲染预算为 64 KiB；单文件上限为 1 MiB。</li><li>候选顺序为 AGENTS.md、CLAUDE.md、AGENTS.local.md、CLAUDE.local.md。</li><li>预算包含文件标题与消息框架；token 按字节数 ÷ 4 粗估。</li><li>预算超限时先省略宽泛文件，再截断最具体的文件。</li></ul><p>此处根据浏览器示例文件演示默认加载规则。未连接真实宿主，也不是当前会话的实际注入记录；预设改写规则时，实际结果可能不同。</p></details>`;}
    function renderHistory(){const r=record();const backup=r.history.find(h=>h.id===state.diffId);if(backup)return renderHistoryDiff(backup);return `<div class="section-heading"><div><h2>保存历史</h2><p class="section-subtitle">${esc(file().path)} 的本地备份</p></div><span class="scope-badge">${r.history.length} 个版本</span></div>${r.history.length?`<p class="section-subtitle">每次覆盖保存前的内容，都会保留为可恢复版本。</p><ol class="history-list">${r.history.map((h,i)=>`<li class="history-item"><span class="history-symbol">${icon(h.source==='rollback'?'history':'clock',16)}</span><div class="od-field od-fill"><span class="history-title">${h.source==='rollback'?'回滚前的版本':'保存前的版本'}${i===0?' · 最近一次':''}</span><span class="history-time">${fmtTime(h.time)}${h.sample?' · 示例记录':''}</span><div class="button-row"><button class="text-action" data-diff="${esc(h.id)}">${icon('diff',14)}查看差异</button><button class="text-action" data-rollback="${esc(h.id)}">${icon('history',14)}恢复此版本</button></div></div><span class="history-size">${fmtBytes(bytes(h.content))}</span></li>`).join('')}</ol><div class="notice">${icon('shield',16)}<p>恢复时会先备份当前已保存的内容，因此回滚操作也可以撤销。</p></div>`:`<div class="empty">${icon('history',32)}<h3>还没有保存历史</h3><p>首次覆盖现有文件后，这里会保留修改前的内容。每个文件的历史独立记录。</p><button class="btn" id="history-to-editor">返回编辑</button></div>`}`;}
    function diffLines(oldText,newText){if(oldText===newText)return '<div class="empty"><h3>内容完全一致</h3><p>此备份与当前已保存的版本没有差异。</p></div>';const a=oldText.split('\n'),b=newText.split('\n');let p=0,s=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;while(s<a.length-p&&s<b.length-p&&a[a.length-1-s]===b[b.length-1-s])s++;const line=(t,v)=>`<div class="diff-line ${t==='+'?'add':t==='-'?'remove':'context'}"><span>${t}</span><span>${esc(v)||' '}</span></div>`;return `<div class="diff-code">${a.slice(Math.max(0,p-3),p).map(v=>line(' ',v)).join('')}${a.slice(p,a.length-s).map(v=>line('-',v)).join('')}${b.slice(p,b.length-s).map(v=>line('+',v)).join('')}${s?a.slice(a.length-s,a.length-s+3).map(v=>line(' ',v)).join(''):''}</div>`;}
    function renderHistoryDiff(h){return `<button class="text-action back-action" id="close-diff">${icon('back',16)}返回历史</button><div class="section-heading"><div><h2>版本差异</h2><p class="section-subtitle">${fmtTime(h.time)} 的备份 → 当前已保存版本</p></div></div><div class="diff-legend"><span>− 备份内容</span><span>+ 当前内容</span></div><div class="editor-card">${diffLines(h.content,record().content)}</div><div class="savebar"><span class="section-subtitle">${esc(file().name)}</span><button class="btn" data-rollback="${esc(h.id)}">${icon('history',16)}恢复此版本</button></div>`;}
    function rollback(id){const h=record().history.find(x=>x.id===id);if(!h)return;openDialog({title:'恢复到这个版本？',copy:`<p>将使用 ${esc(fmtTime(h.time))} 的备份替换当前文件。${dirty()?'尚未保存的编辑会被丢弃。':''}</p><p>恢复前会自动备份当前已保存内容，你仍可以从历史中撤销本次恢复。</p>`,label:'确认恢复',action:()=>save(h.content,'rollback')});}
    function bindHistory(){document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{state.historyScroll=window.scrollY;state.diffId=b.dataset.diff;renderView();});document.querySelectorAll('[data-rollback]').forEach(b=>b.onclick=()=>rollback(b.dataset.rollback));if($('#close-diff'))$('#close-diff').onclick=()=>{state.diffId=null;renderView();requestAnimationFrame(()=>window.scrollTo({top:state.historyScroll,behavior:'instant'}));};if($('#history-to-editor'))$('#history-to-editor').onclick=()=>setTab('editor');}
    function renderView(){const node=$('#view');node.classList.remove('view-enter');node.innerHTML=state.tab==='editor'?renderEditor():state.tab==='chain'?renderChain():renderHistory();node.classList.add('view-enter');if(state.tab==='editor')bindEditor();else if(state.tab==='history')bindHistory();else{const b=$('#refresh-chain');b.onclick=async()=>{b.disabled=true;b.innerHTML=icon('clock');b.setAttribute('aria-busy','true');await new Promise(r=>setTimeout(r,400));renderTabs();renderView();toast('已根据本地保存的文件重新计算');};document.querySelectorAll('[data-chain-file]').forEach(b=>b.onclick=()=>guard(()=>{state.file=b.dataset.chainFile;loadSelected();state.tab='editor';renderAll();}));}}
    function renderAll(){renderWorkspace();renderFileSelector();renderTabs();renderView();}
    document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>setTab(b.dataset.tab);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const names=['editor','chain','history'];let i=names.indexOf(state.tab);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;setTab(names[i]);$('#tab-'+names[i]).focus();};});
    $('#brand-icon').innerHTML=icon('layers',18);$('#help').innerHTML=icon('help',18);$('#footer-icon').innerHTML=icon('info',14);$('#external-icon').innerHTML=icon('arrow',12);
    $('#help').onclick=()=>openDialog({title:'让指令保持清晰',copy:'<p>先选工作区，再从文件列表切换全局、项目和子目录规则。编辑后可以预览 Markdown，再保存更改。</p><p>「生成草稿」展示逐项提案流程；先保存当前修改，再生成和应用提案。「生效链」解释默认加载顺序及预算。「历史记录」支持比较与恢复。</p><p>本页面是独立交互原型。使用浏览器本地示例数据，不读写真实指令文件，不调用模型，也不连接 DSH。清除浏览器站点数据会移除这些本地更改。</p><p>对应插件版本 <code>0.2.0</code>；宿主参考版本 <code>DSH 0.2.1-rc.2</code>。</p>',label:'知道了'});
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(!$('#dialog').open)save();}if(e.key==='Escape'){if(state.filesOpen){state.filesOpen=false;renderFileSelector();$('#file-toggle').focus();}if(state.workspaceOpen){state.workspaceOpen=false;renderWorkspace();$('#workspace-toggle').focus();}}});
    window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
    window.addEventListener('storage',e=>{if(e.key!==STORAGE||!e.newValue)return;try{const latest=JSON.parse(e.newValue);if(!validDatabase(latest))return;const changed=latest.workspaces[state.workspace].files[state.file].version!==state.loadedVersion;if(changed&&dirty()){state.db=latest;state.conflict=true;renderAll();toast('检测到其他页面的更新，当前编辑已保留。','error');}else{state.db=latest;if(changed)loadSelected();renderAll();}}catch(error){}});
    window.addEventListener('resize',resizeEditor);
    renderAll();
    if(storageUnavailable)toast('浏览器存储不可用，更改仅保留在当前页面。','error');
  </script>
